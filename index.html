<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FREE CHART</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg-main: #0b141a;
  --bg-header: #202c33;
  --bg-chat: #0b141a;
  --bg-msg-out: #005c4b;
  --bg-msg-in: #202c33;
  --text-main: #e9edef;
  --text-muted: #8696a0;
  --accent: #00a884;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* LOGIN MODAL */
.modal { display: none; position: fixed; inset: 0; background: var(--bg-main); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
.modal.active { display: flex; }
.login-box { width: 100%; max-width: 400px; text-align: center; }
.login-box h2 { color: var(--accent); margin-bottom: 20px; font-size: 26px; }
.login-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
.login-box input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; border: none; background: var(--bg-header); color: white; font-size: 16px; outline: none; text-align: center; }
.login-box button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--accent); color: white; font-size: 16px; font-weight: 600; cursor: pointer; }

/* HEADER */
.header { background: var(--bg-header); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 10; }
.header h1 { font-size: 20px; font-weight: 600; color: var(--text-main); }
.header-icons { display: flex; gap: 18px; color: var(--text-main); cursor: pointer; }
.header-icons svg { width: 22px; height: 22px; fill: currentColor; }

/* CONTENT AREA */
.content { flex: 1; overflow-y: auto; position: relative; }

/* CHAT ROOM */
.chat-room { display: flex; flex-direction: column; height: 100%; background: var(--bg-chat); }
.chat-header { background: var(--bg-header); padding: 10px 16px; display: flex; align-items: center; gap: 15px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-main); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text-muted); }
.chat-name { font-size: 16px; font-weight: 600; }
.online-status { font-size: 12px; color: var(--accent); }

.chat-messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 8px; }
.msg-bubble { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; position: relative; word-wrap: break-word; }
.msg-out { background: var(--bg-msg-out); align-self: flex-end; border-top-right-radius: 0; }
.msg-in { background: var(--bg-msg-in); align-self: flex-start; border-top-left-radius: 0; }
.msg-time { font-size: 10px; color: rgba(255,255,255,0.6); float: right; margin: 4px 0 -4px 8px; }
.msg-sender { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 4px; }

.chat-input-area { background: var(--bg-header); padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
.chat-input { flex: 1; background: var(--bg-chat); border: none; border-radius: 20px; padding: 12px 16px; color: var(--text-main); outline: none; font-size: 15px; }
.send-btn { background: var(--accent); border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.send-btn svg { width: 18px; height: 18px; fill: white; margin-left: -2px; }

/* SETTINGS PAGE */
.settings-page { display: none; flex-direction: column; height: 100%; background: var(--bg-main); position: fixed; inset: 0; z-index: 200; }
.settings-page.active { display: flex; }
.settings-header { background: var(--bg-header); padding: 15px 16px; display: flex; align-items: center; gap: 15px; }
.settings-header h2 { font-size: 18px; font-weight: 600; }
.settings-body { flex: 1; overflow-y: auto; padding-bottom: 20px; }
.profile-section { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; background: var(--bg-header); margin-bottom: 15px; }
.profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--bg-main); display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--text-muted); margin-bottom: 15px; }
.profile-name { font-size: 20px; font-weight: 600; color: var(--text-main); }
.profile-status { font-size: 14px; color: var(--text-muted); margin-top: 5px; }

.settings-group { background: var(--bg-header); margin-bottom: 15px; }
.settings-item { display: flex; align-items: center; padding: 15px 20px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
.settings-item:last-child { border-bottom: none; }
.settings-icon { width: 24px; height: 24px; fill: var(--text-muted); margin-right: 20px; }
.settings-text { font-size: 16px; color: var(--text-main); flex: 1; }
</style>
</head>
<body>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal active">
  <div class="login-box">
    <h2>FREE CHART</h2>
    <p>Weka jina lako kuanza kuchat</p>
    <input type="text" id="usernameInput" placeholder="Jina lako..." />
    <button onclick="login()">Ingia</button>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <h1>FREE CHART</h1>
  <div class="header-icons" onclick="openSettings()">
    <!-- Settings Icon (Gear) -->
    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">
  <div class="chat-room">
    <div class="chat-header">
      <div class="avatar">🌍</div>
      <div>
        <div class="chat-name">Public Chat</div>
        <div class="online-status">Watu Wote Duniani</div>
      </div>
    </div>

    <div class="chat-messages" id="messagesContainer"></div>
    
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="msgInput" placeholder="Andika ujumbe wako hapa..." onkeypress="handleEnter(event)" />
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- SETTINGS PAGE (HIDDEN BY DEFAULT) -->
<div id="settingsPage" class="settings-page">
  <div class="settings-header">
    <div class="back-btn" onclick="closeSettings()" style="cursor:pointer; color:var(--text-main);">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: currentColor;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </div>
    <h2>Settings</h2>
  </div>
  <div class="settings-body">
    
    <!-- Profile Section -->
    <div class="profile-section" onclick="alert('Badilisha Jina/Picha (Inakuja hivi karibuni)')">
      <div class="profile-avatar" id="settingsAvatar">T</div>
      <div class="profile-name" id="settingsName">T-BERG</div>
      <div class="profile-status">Hey there! I am using Free Chart.</div>
    </div>

    <!-- Settings Groups -->
    <div class="settings-group">
      <div class="settings-item" onclick="alert('Account Settings')">
        <svg class="settings-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <div class="settings-text">Account</div>
      </div>
      <div class="settings-item" onclick="alert('Privacy Settings')">
        <svg class="settings-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <div class="settings-text">Privacy</div>
      </div>
      <div class="settings-item" onclick="alert('Notifications')">
        <svg class="settings-icon" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
        <div class="settings-text">Notifications</div>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-item" onclick="alert('Data and Storage Usage')">
        <svg class="settings-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        <div class="settings-text">Data and Storage Usage</div>
      </div>
      <div class="settings-item" onclick="alert('App Language')">
        <svg class="settings-icon" viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
        <div class="settings-text">App Language</div>
      </div>
    </div>

    <div class="settings-group">
      <div class="settings-item" onclick="logout()">
        <svg class="settings-icon" viewBox="0 0 24 24" style="fill: #ff4444;"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        <div class="settings-text" style="color: #ff4444;">Log Out</div>
      </div>
    </div>

  </div>
</div>

<script>
// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCazZiyRV8t44XDgqLfknluvomzzaX51NQ",
  authDomain: "free-chart-25d35.firebaseapp.com",
  projectId: "free-chart-25d35",
  storageBucket: "free-chart-25d35.firebasestorage.app",
  messagingSenderId: "355101936888",
  appId: "1:355101936888:web:730cf0484000e068caff0d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = "";
let unsubscribeMessages = null;

// LOGIN
function login() {
  const name = document.getElementById("usernameInput").value.trim();
  if (!name) return alert("Weka jina lako kuanza");
  
  currentUser = name;
  localStorage.setItem("freechart_user", name);
  document.getElementById("loginModal").classList.remove("active");
  
  // Update settings profile text
  document.getElementById("settingsName").textContent = name;
  document.getElementById("settingsAvatar").textContent = name.charAt(0).toUpperCase();
  
  loadMessages();
}

// LOGOUT
function logout() {
  if(confirm("Una uhakika unataka kutoka?")) {
    localStorage.removeItem("freechart_user");
    if (unsubscribeMessages) unsubscribeMessages();
    location.reload();
  }
}

// CHECK LOGIN
if (localStorage.getItem("freechart_user")) {
  currentUser = localStorage.getItem("freechart_user");
  document.getElementById("loginModal").classList.remove("active");
  document.getElementById("settingsName").textContent = currentUser;
  document.getElementById("settingsAvatar").textContent = currentUser.charAt(0).toUpperCase();
  loadMessages();
}

// SETTINGS UI
function openSettings() {
  document.getElementById("settingsPage").classList.add("active");
}
function closeSettings() {
  document.getElementById("settingsPage").classList.remove("active");
}

// LOAD MESSAGES
function loadMessages() {
  const container = document.getElementById("messagesContainer");
  container.innerHTML = "<div style='text-align:center; color:#8696a0; font-size:13px; margin-top:20px;'>Inapakia ujumbe...</div>";

  unsubscribeMessages = db.collection("global_chat").orderBy("timestamp", "asc")
    .onSnapshot(snapshot => {
      container.innerHTML = "";
      
      if(snapshot.empty) {
        container.innerHTML = "<div style='text-align:center; color:#8696a0; font-size:13px; margin-top:20px;'>Hakuna ujumbe bado. Anza kuchat!</div>";
      }

      snapshot.forEach(doc => {
        const msg = doc.data();
        const isMe = msg.sender === currentUser;
        const bubble = document.createElement("div");
        bubble.className = `msg-bubble ${isMe ? "msg-out" : "msg-in"}`;
        
        let time = "";
        if (msg.timestamp) {
          const d = msg.timestamp.toDate();
          time = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        bubble.innerHTML = `
          ${!isMe ? `<div class="msg-sender">${msg.sender}</div>` : ''}
          ${msg.text}
          <span class="msg-time">${time}</span>
        `;
        container.appendChild(bubble);
      });
      container.scrollTop = container.scrollHeight;
    });
}

// SEND MESSAGE
function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text || !currentUser) return;

  input.value = "";

  db.collection("global_chat").add({
    text: text,
    sender: currentUser,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err => {
    alert("Imeshindikana kutuma: " + err.message);
  });
}

function handleEnter(e) {
  if (e.key === "Enter") sendMessage();
}
</script>
</body>
</html>
